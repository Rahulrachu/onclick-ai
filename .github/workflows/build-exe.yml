name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pytest
      - run: python -m pytest -q

  blender-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - name: Get Blender 4.2 LTS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar xJ
      - name: Build and render a house through the agent's Blender tool
        run: BLENDER=$PWD/blender-4.2.3-linux-x64/blender PYTHONPATH=. python tests/smoke/blender_house.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-smoke-render
          path: smoke-out/blender/

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Build OnClickAI.exe (window) and OnClickAI-cli.exe (terminal)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name OnClickAI --collect-all playwright run.py
          pyinstaller --noconfirm --onefile --console --name OnClickAI-cli --collect-all playwright run.py
      - name: Smoke test
        shell: pwsh
        run: dist\OnClickAI-cli.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: OnClickAI-windows
          path: dist/*.exe
      - name: Publish release (latest)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          files: dist/*.exe
